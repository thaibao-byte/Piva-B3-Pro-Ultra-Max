<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piva B3 Pro Ultra Control</title>
    <style>
        :root {
            --bg: #0b0d17;
            --card-bg: rgba(20, 24, 45, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --green: #00e676;
            --red: #ff3366;
            --text: #ffffff;
            --subtext: #8a99ad;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        header h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { font-size: 12px; padding: 5px 12px; border-radius: 20px; background: rgba(255, 51, 102, 0.15); color: var(--red); border: 1px solid rgba(255, 51, 102, 0.3); }
        .status-badge.connected { background: rgba(0, 230, 118, 0.15); color: var(--green); border-color: rgba(0, 230, 118, 0.3); }

        .btn-connect { width: 100%; max-width: 480px; padding: 14px; margin-bottom: 16px; border-radius: 12px; background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; font-weight: bold; border: none; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px var(--accent-glow); cursor: pointer; }
        
        .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 480px; margin-bottom: 16px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 8px; border-radius: 12px; text-align: center; }
        .stat-card .label { font-size: 11px; color: var(--subtext); margin-bottom: 4px; }
        .stat-card .value { font-size: 14px; font-weight: bold; color: var(--accent); }

        .section-box { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
        .section-title { font-size: 12px; font-weight: bold; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-opt { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-opt.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .toggle-row span { font-size: 13px; font-weight: 600; }
        .toggle-sub { font-size: 11px; color: var(--subtext); display: block; }

        input[type="range"] { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>PIVA B3 PRO ULTRA</h1>
        <div id="status" class="status-badge">Ngắt kết nối</div>
    </header>

    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">KẾT NỐI TỰ ĐỘNG</button>

    <div class="grid-stats">
        <div class="stat-card"><div class="label">Nhiệt độ Sò</div><div class="value" id="tempFan">-- °C</div></div>
        <div class="stat-card"><div class="label">Nhiệt Củ Sạc</div><div class="value" id="tempCharger">-- °C</div></div>
        <div class="stat-card"><div class="label">Tốc độ quạt</div><div class="value" id="fanRpm">-- RPM</div></div>
        <div class="stat-card"><div class="label">Công suất</div><div class="value" id="power">-- W</div></div>
        <div class="stat-card"><div class="label">Giao thức sạc</div><div class="value" id="protocol">--</div></div>
        <div class="stat-card"><div class="label">Điện áp / Dòng</div><div class="value" id="voltAmp">-- V / -- A</div></div>
    </div>

    <div class="section-box">
        <div class="section-title">Chế độ làm lạnh (Level)</div>
        <div class="btn-group">
            <button class="btn-opt" onclick="setMode(1)">❄️ L1 (Êm)</button>
            <button class="btn-opt" onclick="setMode(2)">❄️ L2 (Vừa)</button>
            <button class="btn-opt" onclick="setMode(3)">❄️ L3 (Mạnh)</button>
        </div>
    </div>

    <div class="section-box">
        <div class="section-title">Chế độ ép xung (Turbo Overclock)</div>
        <div class="toggle-row">
            <div>
                <span>🔥 Bật Siêu Ép Xung</span>
                <span class="toggle-sub">Làm lạnh công suất tối đa</span>
            </div>
            <input type="checkbox" id="turboToggle" onchange="toggleTurbo(this.checked)">
        </div>
        <div style="margin-top: 12px;">
            <span style="font-size: 12px; color: var(--subtext);">Tốc độ quạt:</span>
            <input type="range" min="0" max="100" value="80" onchange="setFanSpeed(this.value)">
        </div>
    </div>

    <script>
        let bleDevice = null;
        let writeCharacteristic = null;

        // Chuẩn UUID của Piva B3 Pro
        const SERVICE_UUID = '49535343-fe7d-4350-a8d4-26080b4e5670';
        const WRITE_UUID   = '49535343-6daa-4d02-abf6-19569aca69fe';

        // 1. KẾT NỐI BLUETOOTH
        async function connectBLE() {
            if (!navigator.bluetooth) {
                alert("Trình duyệt không hỗ trợ Web Bluetooth! Hãy dùng Bluefy trên iOS.");
                return;
            }
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'PIVA' }, { namePrefix: 'B3' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                writeCharacteristic = await service.getCharacteristic(WRITE_UUID);

                document.getElementById('status').innerText = 'Đã kết nối';
                document.getElementById('status').classList.add('connected');
                alert('Đã kết nối thành công với sò PIVA B3 Pro!');
            } catch (error) {
                console.error(error);
                alert('Không thể kết nối: ' + error.message);
            }
        }

        // 2. GỬI MÃ HEX TRỰC TIẾP TỚI PIVA B3 PRO
        async function sendHexBytes(byteArray) {
            if (!writeCharacteristic) {
                console.log("Chưa kết nối BLE. Byte thử nghiệm:", byteArray);
                return;
            }
            try {
                const data = new Uint8Array(byteArray);
                await writeCharacteristic.writeValue(data);
                console.log("Đã gửi byte thành công:", byteArray);
            } catch (err) {
                console.error("Lỗi gửi dữ liệu:", err);
            }
        }

        // 3. ĐIỀU KHIỂN CÁC TÍNH NĂNG (Tập lệnh Hex)
        function setMode(level) {
            // Khung lệnh chỉnh cấp độ làm lạnh: 0xA5 + Level
            sendHexBytes([0xA5, 0x02, level, 0x5A]);
        }

        function toggleTurbo(enable) {
            // Khung lệnh Bật/Tắt Siêu ép xung
            sendHexBytes([0xA5, 0x03, enable ? 0x01 : 0x00, 0x5A]);
        }

        function setFanSpeed(val) {
            // Khung lệnh chỉnh phần trăm tốc độ quạt
            sendHexBytes([0xA5, 0x04, parseInt(val), 0x5A]);
        }

        // 4. BỘ NHỚ CACHE OFFLINE (SERVICE WORKER)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'piva-b3pro-v1';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', e => {
                        e.waitUntil(caches.keys().then(k => Promise.all(k.map(x => x !== CACHE_NAME ? caches.delete(x) : null))));
                        self.clients.claim();
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                try {
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
                } catch (e) {}
            });
        }
    </script>
</body>
</html>
