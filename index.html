<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piva B3 Pro V212 Controller</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #f8fafc; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h2 { margin: 0 0 12px 0; font-size: 1.1rem; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
    .dash-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; }
    .dash-val { font-size: 1.4rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    .dash-lbl { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    button.opt-btn { background: #334155; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; }
    button.opt-btn:active { background: #10b981; }
    .sub-title { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    .status { font-size: 0.85rem; color: #a7f3d0; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <button id="connectBtn" class="btn">Kết Nối Sò B3 Pro</button>
    <div id="statusText" class="status">Trạng thái: Chưa kết nối</div>
  </div>

  <!-- Dashboard chuẩn V212 -->
  <div class="card">
    <h2>Thông Số Hoạt Động (Firmware V212)</h2>
    <div class="dashboard">
      <div class="dash-item">
        <div class="dash-lbl">Tốc độ quạt</div>
        <div id="valFan" class="dash-val">0 RPM</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Công suất</div>
        <div id="valPower" class="dash-val">0 W</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Giao thức cấp nguồn</div>
        <div id="valProtocol" class="dash-val">OFF</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Công tắc tản nhiệt</div>
        <div id="valSwitch" class="dash-val">OFF</div>
      </div>
    </div>
  </div>

  <!-- Chế độ hiệu năng chia L1 - L2 - L3 -->
  <div class="card">
    <h2>Chế Độ Hoạt Động</h2>
    
    <div class="sub-title">1. Chế độ hiệu năng (Lạnh vừa -> Cực lạnh):</div>
    <div class="grid-3" style="margin-bottom: 14px;">
      <button class="opt-btn" onclick="sendV212Cmd([0x01, 0x01, 0x00])">Mức L1</button>
      <button class="opt-btn" onclick="sendV212Cmd([0x01, 0x02, 0x00])">Mức L2</button>
      <button class="opt-btn" onclick="sendV212Cmd([0x01, 0x03, 0x00])">Mức L3</button>
    </div>

    <div class="sub-title">2. Chế độ nâng cao & Đèn LED:</div>
    <div class="grid-2" style="margin-bottom: 8px;">
      <button class="opt-btn" style="background: #b45309;" onclick="sendV212Cmd([0x01, 0x06, 0x00])">Chế độ ép xung</button>
      <button class="opt-btn" onclick="sendV212Cmd([0x01, 0x04, 0x00])">Đ.Khiển thông minh</button>
    </div>
    <div class="grid-2">
      <button class="opt-btn" onclick="sendV212Cmd([0x02, 0x01, 0x01])">Bật LED RGB</button>
      <button class="opt-btn" onclick="sendV212Cmd([0x02, 0x00, 0x00])">Tắt LED RGB</button>
    </div>
  </div>
</div>

<script>
  const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
  const WRITE_UUID_1 = '49535343-6daa-4d02-abf6-19569aca69fe';
  const WRITE_UUID_2 = '49535343-8841-43f4-a8d4-ecbe34729bb3';
  const NOTIFY_UUID  = '49535343-1e4d-4bd9-ba61-23c647249616';

  let charWrite1 = null;
  let charWrite2 = null;

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      document.getElementById('statusText').innerText = "Trạng thái: Đang kết nối...";
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      device.addEventListener('gattserverdisconnected', onDisconnected);

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      try { charWrite1 = await service.getCharacteristic(WRITE_UUID_1); } catch(e){}
      try { charWrite2 = await service.getCharacteristic(WRITE_UUID_2); } catch(e){}

      const notifyChar = await service.getCharacteristic(NOTIFY_UUID);
      await notifyChar.startNotifications();
      notifyChar.addEventListener('characteristicvaluechanged', handleNotifications);

      document.getElementById('statusText').innerText = "Trạng thái: Đã kết nối thành công!";
      document.getElementById('connectBtn').innerText = "Đã Kết Nối";
      document.getElementById('connectBtn').disabled = true;

    } catch (error) {
      console.error("Lỗi:", error);
      document.getElementById('statusText').innerText = "Lỗi kết nối: " + error.message;
    }
  });

  function onDisconnected() {
    document.getElementById('statusText').innerText = "Trạng thái: Đã ngắt kết nối!";
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('connectBtn').innerText = "Kết Nối Lại";
    
    document.getElementById('valPower').innerText = "0 W";
    document.getElementById('valFan').innerText = "0 RPM";
    document.getElementById('valProtocol').innerText = "OFF";
    document.getElementById('valSwitch').innerText = "OFF";
  }

  // Tạo gói tin 7 byte chuẩn xác tuyệt đối cho V212
  async function sendV212Cmd(cmdArray) {
    if (!charWrite1 && !charWrite2) {
      alert("Vui lòng kết nối Bluetooth trước!");
      return;
    }

    const header = [0x20, 0xA5, cmdArray.length];
    const payload = [...header, ...cmdArray];
    const checksum = payload.reduce((sum, b) => sum + b, 0) & 0xFF;
    const packet = new Uint8Array([...payload, checksum]);

    console.log("Gửi Hex:", Array.from(packet).map(b => b.toString(16).padStart(2,'0')).join(' '));

    if (charWrite1) await charWrite1.writeValueWithoutResponse(packet).catch(()=>{});
    if (charWrite2) await charWrite2.writeValueWithoutResponse(packet).catch(()=>{});
  }

  // Giải mã chính xác cho Firmware V212 (Fix 26W / 5508 RPM)
  function handleNotifications(event) {
    const data = event.target.value;
    if (data.byteLength < 9) return;

    // Công suất chuẩn (Byte index 5)
    const power = data.getUint8(5);
    document.getElementById('valPower').innerText = power + " W";

    // Tốc độ quạt RPM chuẩn V212 (Ghép Byte 6 & Byte 7)
    const rpmHigh = data.getUint8(6);
    const rpmLow = data.getUint8(7);
    const rpm = (rpmHigh << 8) | rpmLow;

    document.getElementById('valFan').innerText = (rpm > 0 ? rpm : 0) + " RPM";
    document.getElementById('valProtocol').innerText = power >= 20 ? "PPS" : "PD / Normal";
    document.getElementById('valSwitch').innerText = power > 0 ? "ON" : "OFF";
  }
</script>
</body>
</html>
