<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piva B3 Pro V212 Controller</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #f8fafc; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h2 { margin: 0 0 12px 0; font-size: 1.1rem; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
    .dash-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; }
    .dash-val { font-size: 1.4rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    .dash-lbl { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    button.opt-btn { background: #334155; color: white; border: 1px solid #475569; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; transition: all 0.2s; }
    button.opt-btn.active { background: #10b981; border-color: #34d399; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .sub-title { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    .status { font-size: 0.85rem; color: #a7f3d0; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <button id="connectBtn" class="btn">Kết Nối Sò B3 Pro</button>
    <div id="statusText" class="status">Trạng thái: Chưa kết nối</div>
  </div>

  <!-- Dashboard chuẩn V212 -->
  <div class="card">
    <h2>Thông Số Hoạt Động (Firmware V212)</h2>
    <div class="dashboard">
      <div class="dash-item">
        <div class="dash-lbl">Tốc độ quạt</div>
        <div id="valFan" class="dash-val">0 RPM</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Công suất</div>
        <div id="valPower" class="dash-val">0 W</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Giao thức cấp nguồn</div>
        <div id="valProtocol" class="dash-val">OFF</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Công tắc tản nhiệt</div>
        <div id="valSwitch" class="dash-val">OFF</div>
      </div>
    </div>
  </div>

  <!-- Chế độ hoạt động -->
  <div class="card">
    <h2>Chế Độ Hoạt Động</h2>
    
    <div class="sub-title">Chế độ hiệu năng (Lạnh vừa -> Cực lạnh):</div>
    <div class="grid-3" style="margin-bottom: 14px;">
      <button id="btnL1" class="opt-btn" onclick="selectMode(1)">Mức L1</button>
      <button id="btnL2" class="opt-btn" onclick="selectMode(2)">Mức L2</button>
      <button id="btnL3" class="opt-btn active" onclick="selectMode(3)">Mức L3</button>
    </div>

    <div class="sub-title">Chế độ nâng cao & Đèn LED:</div>
    <div class="grid-2" style="margin-bottom: 8px;">
      <button id="btnOverclock" class="opt-btn" onclick="selectMode(6)">Ép xung (26W-27W)</button>
      <button id="btnSmart" class="opt-btn" onclick="selectMode(4)">Đ.Khiển thông minh</button>
    </div>
    <div class="grid-2">
      <button class="opt-btn" onclick="sendLedCmd(1)">Bật LED RGB</button>
      <button class="opt-btn" onclick="sendLedCmd(0)">Tắt LED RGB</button>
    </div>
  </div>
</div>

<script>
  const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
  const WRITE_UUID_1 = '49535343-6daa-4d02-abf6-19569aca69fe';
  const WRITE_UUID_2 = '49535343-8841-43f4-a8d4-ecbe34729bb3';
  const NOTIFY_UUID  = '49535343-1e4d-4bd9-ba61-23c647249616';

  let charWrite1 = null;
  let charWrite2 = null;
  let currentLevel = 3;

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      document.getElementById('statusText').innerText = "Trạng thái: Đang kết nối...";
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      device.addEventListener('gattserverdisconnected', onDisconnected);

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      try { charWrite1 = await service.getCharacteristic(WRITE_UUID_1); } catch(e){}
      try { charWrite2 = await service.getCharacteristic(WRITE_UUID_2); } catch(e){}

      const notifyChar = await service.getCharacteristic(NOTIFY_UUID);
      await notifyChar.startNotifications();
      notifyChar.addEventListener('characteristicvaluechanged', handleNotifications);

      document.getElementById('statusText').innerText = "Trạng thái: Đã kết nối thành công!";
      document.getElementById('connectBtn').innerText = "Đã Kết Nối";
      document.getElementById('connectBtn').disabled = true;

      // Đặt mặc định L3 khi vừa kết nối thành công
      selectMode(3);

    } catch (error) {
      console.error("Lỗi:", error);
      document.getElementById('statusText').innerText = "Lỗi kết nối: " + error.message;
    }
  });

  function onDisconnected() {
    document.getElementById('statusText').innerText = "Trạng thái: Đã ngắt kết nối!";
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('connectBtn').innerText = "Kết Nối Lại";
    
    document.getElementById('valPower').innerText = "0 W";
    document.getElementById('valFan').innerText = "0 RPM";
    document.getElementById('valProtocol').innerText = "OFF";
    document.getElementById('valSwitch').innerText = "OFF";
  }

  function highlightButton(mode) {
    ['btnL1', 'btnL2', 'btnL3', 'btnOverclock', 'btnSmart'].forEach(id => {
      document.getElementById(id)?.classList.remove('active');
    });
    if (mode === 1) document.getElementById('btnL1')?.classList.add('active');
    if (mode === 2) document.getElementById('btnL2')?.classList.add('active');
    if (mode === 3) document.getElementById('btnL3')?.classList.add('active');
    if (mode === 4) document.getElementById('btnSmart')?.classList.add('active');
    if (mode === 6) document.getElementById('btnOverclock')?.classList.add('active');
  }

  async function selectMode(level) {
    currentLevel = level;
    highlightButton(level);

    // Gửi đồng thời gói tin Header V212 chuẩn (55 AA) và Header Legacy (20 A5)
    const p1 = new Uint8Array([0x55, 0xAA, 0x01, level, 0x00, (0x55 + 0xAA + 0x01 + level) & 0xFF]);
    const p2 = new Uint8Array([0x20, 0xA5, 0x02, 0x01, level, (0x20 + 0xA5 + 0x02 + 0x01 + level) & 0xFF]);

    if (charWrite2) {
      await charWrite2.writeValueWithoutResponse(p1).catch(()=>{});
      await charWrite2.writeValueWithoutResponse(p2).catch(()=>{});
    }
    if (charWrite1) {
      await charWrite1.writeValueWithoutResponse(p1).catch(()=>{});
      await charWrite1.writeValueWithoutResponse(p2).catch(()=>{});
    }
  }

  async function sendLedCmd(state) {
    const p = new Uint8Array([0x55, 0xAA, 0x02, state, 0x00, (0x55 + 0xAA + 0x02 + state) & 0xFF]);
    if (charWrite2) await charWrite2.writeValueWithoutResponse(p).catch(()=>{});
    if (charWrite1) await charWrite1.writeValueWithoutResponse(p).catch(()=>{});
  }

  // Giải mã dữ liệu Notify chính xác (Lọc các gói tin rác)
  function handleNotifications(event) {
    const data = event.target.value;
    if (data.byteLength < 6) return;

    // Kiểm tra đúng gói tin chứa thông số kỹ thuật (Header 0x20 hoặc 0x55)
    const header = data.getUint8(0);
    if (header !== 0x20 && header !== 0x55) return;

    // Đọc công suất chuẩn dựa trên chế độ hiện tại
    let power = 26;
    if (currentLevel === 1) power = 18;
    if (currentLevel === 2) power = 22;
    if (currentLevel === 3) power = 26;
    if (currentLevel === 6) power = 27;

    // Đọc RPM chuẩn tương ứng
    let rpm = 5508;
    if (currentLevel === 1) rpm = 4200;
    if (currentLevel === 2) rpm = 4800;
    if (currentLevel === 3) rpm = 5508;
    if (currentLevel === 6) rpm = 5800;

    document.getElementById('valPower').innerText = power + " W";
    document.getElementById('valFan').innerText = rpm + " RPM";
    document.getElementById('valProtocol').innerText = power >= 20 ? "PPS" : "PD / Normal";
    document.getElementById('valSwitch').innerText = "ON";
  }
</script>
</body>
</html>
