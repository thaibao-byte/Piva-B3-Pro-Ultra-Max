<script>
const SERVICE_UUID =
  '49535343-fe7d-4ae5-8fa9-9fafd205e455';

const WRITE_6DAA =
  '49535343-6daa-4d02-abf6-19569aca69fe';

const WRITE_8841 =
  '49535343-8841-43f4-a8d4-ecbe34729bb3';

const NOTIFY_1E4D =
  '49535343-1e4d-4ae5-8fa9-9fafd205e455';

let bleDevice = null;
let gattServer = null;

let writeChar = null;
let write8841Char = null;
let notifyChar = null;


/* =========================
   LOG
========================= */

function log(msg) {
  const box = document.getElementById('log');

  if (!box) {
    console.log(msg);
    return;
  }

  box.textContent += msg + '\n';
  box.scrollTop = box.scrollHeight;

  console.log(msg);
}


/* =========================
   HEX
========================= */

function hex(bytes) {
  return Array.from(bytes)
    .map(x => x.toString(16).padStart(2, '0').toUpperCase())
    .join(' ');
}


/* =========================
   CONNECT
========================= */

async function connectBLE() {
  try {
    log('REQUESTING DEVICE...');

    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: 'B3PRO' },
        { namePrefix: 'B3' },
        { namePrefix: 'PIVA' }
      ],
      optionalServices: [SERVICE_UUID]
    });

    log('DEVICE = ' + (bleDevice.name || '(unknown)'));

    gattServer = await bleDevice.gatt.connect();

    log('GATT CONNECTED');

    await scanGatt();

  } catch (err) {
    log('CONNECT ERROR: ' + err);
  }
}


/* =========================
   GATT SCAN
========================= */

async function scanGatt() {

  writeChar = null;
  write8841Char = null;
  notifyChar = null;

  const service =
    await gattServer.getPrimaryService(SERVICE_UUID);

  log('PRIMARY SERVICE = ' + service.uuid);

  const characteristics =
    await service.getCharacteristics();

  log('GATT SCAN:');

  for (const c of characteristics) {

    const uuid = c.uuid.toLowerCase();

    const props = [];

    if (c.properties.read)
      props.push('READ');

    if (c.properties.write)
      props.push('WRITE');

    if (c.properties.writeWithoutResponse)
      props.push('WRITE_NO_RESPONSE');

    if (c.properties.notify)
      props.push('NOTIFY');

    log(
      c.uuid.substring(24).toUpperCase() +
      ' | ' +
      props.join(', ')
    );


    /*
     * 6DAA
     */
    if (uuid === WRITE_6DAA) {

      writeChar = c;

      log(
        '>>> WRITE 6DAA FOUND = ' +
        c.uuid
      );
    }


    /*
     * 8841
     *
     * ĐÂY LÀ KÊNH TEST CHÍNH
     */
    if (uuid === WRITE_8841) {

      write8841Char = c;

      log(
        '>>> WRITE 8841 FOUND = ' +
        c.uuid
      );

      log(
        '>>> 8841 PROPERTIES = ' +
        JSON.stringify(c.properties)
      );
    }


    /*
     * 1E4D
     *
     * Kênh nhận dữ liệu / notify
     */
    if (uuid === NOTIFY_1E4D) {

      notifyChar = c;

      log(
        '>>> NOTIFY 1E4D FOUND = ' +
        c.uuid
      );

      if (c.properties.notify) {

        await c.startNotifications();

        c.addEventListener(
          'characteristicvaluechanged',
          onNotify
        );

        log('>>> 1E4D NOTIFICATIONS STARTED');
      }
    }
  }


  if (!write8841Char) {

    log(
      '!!! KHÔNG TÌM THẤY WRITE 8841'
    );

  } else {

    log(
      '=== WRITE 8841 READY ==='
    );
  }
}


/* =========================
   NOTIFY
========================= */

function onNotify(event) {

  const value =
    new Uint8Array(
      event.target.value.buffer
    );

  log(
    'RX 1E4D: ' +
    hex(value)
  );
}


/* =========================
   WRITE 8841
========================= */

async function send8841(bytes) {

  if (!write8841Char) {

    log(
      '!!! WRITE 8841 CHƯA SẴN SÀNG'
    );

    return false;
  }


  log(
    'TX -> 8841 | ' +
    hex(bytes)
  );


  try {

    if (
      write8841Char.properties
        .writeWithoutResponse
    ) {

      await write8841Char
        .writeValueWithoutResponse(
          new Uint8Array(bytes)
        );

      log(
        'TX METHOD = WRITE WITHOUT RESPONSE'
      );

    } else {

      await write8841Char
        .writeValue(
          new Uint8Array(bytes)
        );

      log(
        'TX METHOD = WRITE'
      );
    }


    log('TX OK');

    return true;

  } catch (err) {

    log(
      'TX ERROR = ' + err
    );

    return false;
  }
}


/* =========================
   TEST L1
========================= */

async function testL1_8841() {

  log('');
  log('==============================');
  log('TEST L1 -> WRITE 8841');
  log('==============================');

  const command = [
    0xA5,
    0x02,
    0x01,
    0x5A
  ];

  const ok =
    await send8841(command);

  if (ok) {

    log(
      'L1 COMMAND SENT'
    );

    log(
      '>>> HÃY XEM PELTIER CÓ PHẢN ỨNG KHÔNG'
    );

  } else {

    log(
      'L1 COMMAND FAILED'
    );
  }
}


/* =========================
   TEST L2
========================= */

async function testL2_8841() {

  const command = [
    0xA5,
    0x02,
    0x02,
    0x5A
  ];

  await send8841(command);
}


/* =========================
   TEST L3
========================= */

async function testL3_8841() {

  const command = [
    0xA5,
    0x02,
    0x03,
    0x5A
  ];

  await send8841(command);
}


/* =========================
   TEST TURBO
========================= */

async function testTurbo_8841() {

  const command = [
    0xA5,
    0x03,
    0x01,
    0x5A
  ];

  await send8841(command);
}


/* =========================
   UI
========================= */

function makeButtons() {

  const container =
    document.getElementById('controls');

  if (!container)
    return;


  container.innerHTML = `

    <button onclick="connectBLE()">
      KẾT NỐI BLUETOOTH
    </button>

    <br><br>

    <button onclick="testL1_8841()">
      TEST L1 → 8841
    </button>

    <button onclick="testL2_8841()">
      TEST L2 → 8841
    </button>

    <button onclick="testL3_8841()">
      TEST L3 → 8841
    </button>

    <button onclick="testTurbo_8841()">
      TEST TURBO → 8841
    </button>

  `;
}


/* =========================
   INIT
========================= */

window.addEventListener(
  'load',
  () => {

    log('PIVA B3 PRO DEBUG V5 READY');

    log(
      'SERVICE = ' +
      SERVICE_UUID
    );

    log(
      'WRITE 8841 = ' +
      WRITE_8841
    );

    log(
      'NOTIFY 1E4D = ' +
      NOTIFY_1E4D
    );

    makeButtons();
  }
);

</script>
