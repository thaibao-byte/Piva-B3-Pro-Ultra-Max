<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIVA B3 PRO CONTROL CENTER</title>
  <style>
    :root {
      --bg: #060913;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --cyan: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.5);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.5);
      --purple: #8b5cf6;
      --danger: #ff0055;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 70%);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }
    .container { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brand-box { display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .title { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
    .version-tag { font-size: 0.65rem; background: rgba(0, 242, 254, 0.15); color: var(--cyan); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(0, 242, 254, 0.3); font-weight: 700; }

    .status-badge { font-size: 0.75rem; padding: 5px 12px; border-radius: 20px; background: #1e293b; color: var(--text-muted); font-weight: 600; }
    .status-badge.connected { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--green); box-shadow: 0 0 10px var(--green-glow); }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #00f2fe, #0891b2); color: #000; box-shadow: 0 0 14px var(--cyan-glow); }
    .btn-danger { background: linear-gradient(135deg, #ff0055, #be123c); color: #fff; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

    /* Công tắc tản nhiệt */
    .switch-card { display: flex; justify-content: space-between; align-items: center; }
    .switch-info { display: flex; flex-direction: column; gap: 3px; }
    .switch-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .switch-sub { font-size: 0.78rem; color: var(--text-muted); }
    .switch { position: relative; width: 60px; height: 32px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #1e293b; border: 1px solid #334155; border-radius: 32px; cursor: pointer; transition: 0.3s; }
    .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    input:checked + .slider { background: linear-gradient(135deg, #10b981, #059669); border-color: #34d399; box-shadow: 0 0 12px var(--green-glow); }
    input:checked + .slider:before { transform: translateX(28px); }

    /* Dashboard 4 ô chuẩn hãng */
    .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .dash-box {
      background: rgba(11, 17, 32, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .dash-box:after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0.4;
    }
    .dash-lbl { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .dash-val { font-size: 1.45rem; font-weight: 800; color: #fff; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .dash-val.highlight { color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow); }

    /* Controls */
    .section-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    
    button.mode-btn {
      background: #131b2e;
      color: #94a3b8;
      border: 1px solid #1e293b;
      padding: 14px 6px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    button.mode-btn span.sub { font-size: 0.68rem; opacity: 0.7; font-weight: normal; }
    button.mode-btn:active { transform: scale(0.96); }

    /* HIỆU ỨNG SÁNG LIÊN TỤC THEO CHẾ ĐỘ CỦA SÒ */
    button.mode-btn.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(8, 145, 178, 0.35)) !important;
      color: #ffffff !important;
      border: 1px solid var(--cyan) !important;
      box-shadow: 0 0 18px var(--cyan-glow), inset 0 0 10px rgba(0, 242, 254, 0.2) !important;
      font-weight: 800 !important;
    }
    button.mode-btn.active-oc {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(190, 18, 60, 0.4)) !important;
      color: #ffffff !important;
      border: 1px solid #ff0055 !important;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6) !important;
    }

    select {
      width: 100%;
      background: #131b2e;
      color: #fff;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }

    .log-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: #10b981;
      background: #090e1a;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      min-height: 36px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <div class="brand-box">
        <div class="logo-dot"></div>
        <span class="title">PIVA B3 PRO</span>
        <span class="version-tag">v3.0.0 PRO</span>
      </div>
      <span id="statusBadge" class="status-badge">Chưa kết nối</span>
    </div>
    <div class="btn-group">
      <button id="connectBtn" class="btn btn-primary">KẾT NỐI SÒ</button>
      <button id="disconnectBtn" class="btn btn-danger" onclick="disconnectDevice()" disabled>NGẮT KẾT NỐI</button>
    </div>
  </div>

  <div class="card switch-card">
    <div class="switch-info">
      <span class="switch-title">Công Tắc Tản Nhiệt</span>
      <span class="switch-sub" id="powerSubText">Đang Tắt (Standby)</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="powerSwitch" onchange="userTogglePower(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <div class="card">
    <div class="dashboard">
      <div class="dash-box">
        <div class="dash-lbl">Tốc độ quạt</div>
        <div id="valFan" class="dash-val highlight">0 RPM</div>
      </div>
      <div class="dash-box">
        <div class="dash-lbl">Công suất thực</div>
        <div id="valPower" class="dash-val highlight">0 W</div>
      </div>
      <div class="dash-box">
        <div class="dash-lbl">Cấp nguồn</div>
        <div id="valProtocol" class="dash-val">OFF</div>
      </div>
      <div class="dash-box">
        <div class="dash-lbl">Chế độ hiện tại</div>
        <div id="valMode" class="dash-val" style="font-size: 1.05rem;">OFF</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Cài Đặt Hiệu Suất</div>
    <div class="grid-3" style="margin-bottom: 12px;">
      <button id="btnL1" class="mode-btn" onclick="userSelectMode(1)">
        <span>🍃 Im lặng</span>
        <span class="sub">Mức 1 (15W)</span>
      </button>
      <button id="btnL2" class="mode-btn" onclick="userSelectMode(2)">
        <span>⚖️ Cân bằng</span>
        <span class="sub">Mức 2 (20W)</span>
      </button>
      <button id="btnL3" class="mode-btn" onclick="userSelectMode(3)">
        <span>❄️ Cực lạnh</span>
        <span class="sub">Mức 3 (26W)</span>
      </button>
    </div>

    <div class="section-title">Nâng Cao</div>
    <div class="grid-2">
      <button id="btnOc" class="mode-btn" onclick="userSelectMode(6)">
        <span>⚡ Ép xung</span>
        <span class="sub">Công suất đỉnh 27W</span>
      </button>
      <button id="btnSmart" class="mode-btn" onclick="userSelectMode(4)">
        <span>🧠 Thông minh</span>
        <span class="sub">Tự điều tốc AI</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Hiệu Ứng Đèn RGB</div>
    <select id="ledEffectSelect" onchange="userSelectLed(this.value)">
      <option value="1">🌈 1. Ánh sáng chảy (Rainbow)</option>
      <option value="2">💨 2. Nhịp thở (Breathing)</option>
      <option value="3">⚡ 3. Đuổi theo (Chasing)</option>
      <option value="4">🌌 4. Đệm (Ambient)</option>
      <option value="5">💡 5. Sáng liên tục (Constant)</option>
      <option value="6">✨ 6. Vòng sao (Star Ring)</option>
      <option value="7">🔥 7. Linh động (Dynamic)</option>
      <option value="0">❌ Tắt Đèn LED</option>
    </select>
  </div>

  <div class="log-box" id="debugLog">Hệ thống: Sẵn sàng kết nối...</div>
</div>

<script>
  // UUID CHUẨN ISSC PIVA B3 PRO
  const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
  const CHAR_RX_UUID = '49535343-8841-43f4-a8d4-ecbe34729bb3'; // Cổng nhận lệnh chính
  const CHAR_TX_UUID = '49535343-1e4d-4bd9-ba61-23c647249616'; // Cổng truyền dữ liệu 2 chiều

  let bluetoothDevice = null;
  let rxChar = null;
  let txChar = null;
  let allWriteChars = [];
  let isUserInteracting = false;
  let interactionTimer = null;

  function setLog(text) {
    document.getElementById('debugLog').innerText = text;
  }

  // KẾT NỐI GATT
  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      setLog("Đang quét tìm sò B3PRO...");
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

      setLog("Đang kết nối GATT...");
      const server = await bluetoothDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      const chars = await service.getCharacteristics();
      allWriteChars = [];
      rxChar = null;
      txChar = null;

      for (const c of chars) {
        const u = c.uuid.toLowerCase();
        if (u.includes('8841')) rxChar = c;
        if (u.includes('1e4d')) txChar = c;
        if (c.properties.write || c.properties.writeWithoutResponse) {
          allWriteChars.push(c);
        }
      }

      // Đăng ký nhận thông số liên tục từ sò
      const notifyTarget = txChar || chars.find(c => c.properties.notify);
      if (notifyTarget) {
        await notifyTarget.startNotifications();
        notifyTarget.addEventListener('characteristicvaluechanged', handleNotifications);
      }

      document.getElementById('statusBadge').innerText = "ĐÃ KẾT NỐI";
      document.getElementById('statusBadge').classList.add('connected');
      document.getElementById('connectBtn').disabled = true;
      document.getElementById('disconnectBtn').disabled = false;
      setLog("Kết nối thành công! Đã đồng bộ phần cứng.");

    } catch (err) {
      setLog("Lỗi: " + err.message);
    }
  });

  function disconnectDevice() {
    if (bluetoothDevice && bluetoothDevice.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    document.getElementById('statusBadge').innerText = "ĐÃ NGẮT";
    document.getElementById('statusBadge').classList.remove('connected');
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('disconnectBtn').disabled = true;
    document.getElementById('powerSwitch').checked = false;
    document.getElementById('powerSubText').innerText = "Đang Tắt (Standby)";
    document.getElementById('valPower').innerText = "0 W";
    document.getElementById('valFan').innerText = "0 RPM";
    document.getElementById('valProtocol').innerText = "OFF";
    document.getElementById('valMode').innerText = "OFF";
    clearAllButtons();
    setLog("Đã ngắt kết nối với thiết bị.");
  }

  function clearAllButtons() {
    ['btnL1', 'btnL2', 'btnL3', 'btnOc', 'btnSmart'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.remove('active');
        el.classList.remove('active-oc');
      }
    });
  }

  // TỰ ĐỘNG LÀM SÁNG NÚT THEO TRẠNG THÁI CỦA SÒ
  function highlightModeUI(mode, power) {
    clearAllButtons();

    if (mode === 6 || (power >= 26.5)) {
      document.getElementById('btnOc')?.classList.add('active-oc');
      document.getElementById('valMode').innerText = "⚡ Ép xung";
    } else if (mode === 3 || (power >= 24 && mode !== 6)) {
      document.getElementById('btnL3')?.classList.add('active');
      document.getElementById('valMode').innerText = "❄️ Cực lạnh";
    } else if (mode === 2 || (power >= 18 && power < 24)) {
      document.getElementById('btnL2')?.classList.add('active');
      document.getElementById('valMode').innerText = "⚖️ Cân bằng";
    } else if (mode === 1 || mode === 0x0D || (power > 0 && power < 18)) {
      document.getElementById('btnL1')?.classList.add('active');
      document.getElementById('valMode').innerText = "🍃 Im lặng";
    } else if (mode === 4) {
      document.getElementById('btnSmart')?.classList.add('active');
      document.getElementById('valMode').innerText = "🧠 Thông minh";
    }
  }

  // HÀM PHÁT LỆNH ĐA KÊNH ĐẢM BẢO SÒ NHẬN 100%
  async function transmitCommand(payload) {
    const len = payload.length;
    const body = [0x20, 0xA5, len, ...payload];
    const checksum = body.reduce((a, b) => a + b, 0) & 0xFF;
    const packet = new Uint8Array([...body, checksum]);

    const hexStr = Array.from(packet).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    setLog("Đang phát lệnh: " + hexStr);

    const sendToChar = async (c) => {
      if (!c) return false;
      try {
        if (c.properties.writeWithoutResponse) {
          await c.writeValueWithoutResponse(packet);
          return true;
        } else if (c.properties.write) {
          await c.writeValue(packet);
          return true;
        }
      } catch (e) {
        try { await c.writeValue(packet); return true; } catch (err) {}
      }
      return false;
    };

    // Bắn lệnh vào cả cổng RX chuyên dụng và TX hai chiều
    let sent = false;
    if (rxChar) sent = await sendToChar(rxChar);
    if (txChar) sent = await sendToChar(txChar) || sent;

    if (!sent) {
      for (const c of allWriteChars) {
        if (await sendToChar(c)) { sent = true; break; }
      }
    }

    if (sent) {
      setLog("Đã thi hành: " + hexStr);
    } else {
      setLog("Lỗi: Không thể truyền dữ liệu!");
    }
  }

  // Khóa UI trong 2s khi người dùng bấm để không bị gói tin cũ của sò đè ngược
  function triggerUserLock() {
    isUserInteracting = true;
    clearTimeout(interactionTimer);
    interactionTimer = setTimeout(() => { isUserInteracting = false; }, 2000);
  }

  // CHỌN CHẾ ĐỘ HOẠT ĐỘNG
  async function userSelectMode(mode) {
    triggerUserLock();
    document.getElementById('powerSwitch').checked = true;
    document.getElementById('powerSubText').innerText = "Đang Bật (Hoạt động)";
    highlightModeUI(mode, 25);

    // Bắn gói lệnh 2 lần liên tiếp cách nhau 60ms để chắc chắn vi điều khiển nhận
    await transmitCommand([0x01, mode, 0x00]);
    setTimeout(() => transmitCommand([0x01, mode, 0x00]), 60);
  }

  // CÔNG TẮC BẬT / TẮT
  async function userTogglePower(isOn) {
    triggerUserLock();
    if (isOn) {
      document.getElementById('powerSubText').innerText = "Đang Bật (Hoạt động)";
      await userSelectMode(3); // Mặc định mở Mức 3 Cực lạnh 26W
    } else {
      document.getElementById('powerSubText').innerText = "Đang Tắt (Standby)";
      document.getElementById('valMode').innerText = "OFF";
      clearAllButtons();
      await transmitCommand([0x01, 0x00, 0x00]);
      setTimeout(() => transmitCommand([0x01, 0x00, 0x00]), 60);
    }
  }

  // ĐỔI HIỆU ỨNG ĐÈN LED
  async function userSelectLed(val) {
    await transmitCommand([0x02, parseInt(val), 0x00]);
  }

  // BỘ GIẢI MÃ PHẢN HỒI THÔNG SỐ & ĐỒNG BỘ 2 CHIỀU TỪ SÒ
  function handleNotifications(event) {
    const data = event.target.value;
    if (data.byteLength < 8) return;

    if (data.getUint8(0) === 0x20 && data.getUint8(1) === 0xA5) {
      const power = data.getUint8(3);
      const modeByte = data.getUint8(4);
      const rpm = (data.getUint8(7) << 8) | data.getUint8(6);

      // Cập nhật thông số tức thì
      document.getElementById('valPower').innerText = power + " W";
      document.getElementById('valFan').innerText = rpm + " RPM";
      document.getElementById('valProtocol').innerText = power >= 20 ? "PPS" : (power > 0 ? "PD" : "OFF");

      // Nếu người dùng không vừa bấm thì đồng bộ nút sáng theo sò
      if (!isUserInteracting) {
        const isRunning = (power > 0 || rpm > 0);
        document.getElementById('powerSwitch').checked = isRunning;
        document.getElementById('powerSubText').innerText = isRunning ? "Đang Bật (Hoạt động)" : "Đang Tắt (Standby)";

        if (isRunning) {
          highlightModeUI(modeByte, power);
        } else {
          clearAllButtons();
          document.getElementById('valMode').innerText = "OFF";
        }
      }
    }
  }
</script>
</body>
</html>
