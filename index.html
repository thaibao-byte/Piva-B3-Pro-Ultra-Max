<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PIVA B3 Pro Controller</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:20px 14px 50px;
  background:#090b10;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  max-width:460px;
  margin:auto;
}

h1{
  font-size:25px;
  margin:8px 0 4px;
}

.sub{
  color:#888;
  font-size:12px;
  margin-bottom:18px;
}

button{
  width:100%;
  min-height:58px;
  margin:6px 0;
  border:0;
  border-radius:16px;
  background:#292b30;
  color:white;
  font-size:17px;
  font-weight:700;
}

button:active{
  transform:scale(.98);
}

.connect{
  background:#087f45;
}

.disconnect{
  background:#a91e35;
}

.card{
  background:#17191e;
  border-radius:20px;
  padding:15px;
  margin:12px 0;
}

.title{
  font-size:18px;
  font-weight:800;
  margin-bottom:10px;
}

.row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.row button{
  min-height:62px;
  margin:0;
}

.active{
  background:#00b968;
  color:white;
}

.turbo{
  background:#e88b00;
}

.smart{
  background:#087bd6;
}

.led{
  background:#6639bd;
}

.danger{
  background:#a91e35;
}

.log{
  background:#000;
  color:#00ff72;
  font-family:monospace;
  font-size:12px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
  height:360px;
  overflow:auto;
  padding:12px;
  border-radius:14px;
}

.small{
  font-size:12px;
  color:#888;
  line-height:1.5;
}

input[type=range]{
  width:100%;
}

label{
  display:block;
  margin-top:15px;
  font-weight:700;
}

.value{
  float:right;
  color:#00e5ff;
}

.status{
  padding:12px;
  border-radius:12px;
  background:#292b30;
  text-align:center;
  margin-bottom:12px;
}
</style>
</head>

<body>

<div class="app">

<h1>❄️ PIVA B3 Pro</h1>
<div class="sub">
    Controller — WRITE 8841
</div>

<div id="status" class="status">
    🔴 Chưa kết nối
</div>

<button id="connectBtn"
        class="connect"
        onclick="connectBLE()">
    🔵 KẾT NỐI B3 PRO
</button>

<!-- ================= LÀM LẠNH ================= -->

<div class="card">

<div class="title">
    ❄️ MỨC LÀM LẠNH
</div>

<div class="row">

<button id="l1"
        onclick="setMode(1)">
    L1
</button>

<button id="l2"
        onclick="setMode(2)">
    L2
</button>

<button id="l3"
        onclick="setMode(3)">
    L3
</button>

</div>

</div>


<!-- ================= TURBO ================= -->

<div class="card">

<div class="title">
    🔥 TURBO
</div>

<button class="turbo"
        onclick="turbo(true)">
    TURBO ON
</button>

<button onclick="turbo(false)">
    TURBO OFF
</button>

</div>


<!-- ================= SMART ================= -->

<div class="card">

<div class="title">
    🧠 SMART
</div>

<button class="smart"
        onclick="smart(true)">
    SMART ON
</button>

<button class="danger"
        onclick="smart(false)">
    SMART OFF
</button>

</div>


<!-- ================= QUẠT ================= -->

<div class="card">

<div class="title">
    🌀 QUẠT
</div>

<div class="row">

<button onclick="fan(20)">20%</button>
<button onclick="fan(40)">40%</button>
<button onclick="fan(60)">60%</button>

</div>

<div class="row" style="margin-top:7px">

<button onclick="fan(80)">80%</button>
<button onclick="fan(100)">100%</button>
<button onclick="fan(0)">AUTO</button>

</div>

<p class="small">
    ⚠️ Lệnh quạt đang ở chế độ thử nghiệm.
</p>

</div>


<!-- ================= LED ================= -->

<div class="card">

<div class="title">
    💡 LED
</div>

<div class="row">

<button class="led"
        onclick="led(0)">
    OFF
</button>

<button class="led"
        onclick="led(1)">
    🌈
</button>

<button class="led"
        onclick="led(2)">
    🌊
</button>

</div>

<div class="row" style="margin-top:7px">

<button class="led"
        onclick="led(3)">
    🔀
</button>

<button class="led"
        onclick="led(4)">
    🔴
</button>

<button class="led"
        onclick="led(5)">
    🔵
</button>

</div>

<label>
    Độ sáng
    <span id="brightnessValue"
          class="value">
        100%
    </span>
</label>

<input id="brightness"
       type="range"
       min="1"
       max="100"
       value="100"
       oninput="brightnessChanged(this.value)">

<label>
    Tốc độ LED
    <span id="speedValue"
          class="value">
        50%
    </span>
</label>

<input id="speed"
       type="range"
       min="1"
       max="100"
       value="50"
       oninput="speedChanged(this.value)">

<p class="small">
    ⚠️ LED/brightness/speed chưa được xác nhận bằng phần cứng.
</p>

</div>


<!-- ================= DEBUG ================= -->

<div class="card">

<div class="title">
    🧪 DEBUG
</div>

<button onclick="scanGATT()">
    QUÉT GATT
</button>

<button onclick="select8841()">
    CHỌN WRITE 8841
</button>

<button onclick="clearLog()"
        class="danger">
    XÓA LOG
</button>

</div>


<div class="card">

<div class="title">
    📡 BLE LOG
</div>

<div id="log"
     class="log"></div>

</div>

</div>


<script>

/* =========================================================
   UUID
========================================================= */

const SERVICE_UUID =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const WRITE_8841_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const NOTIFY_1E4D_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";


/* =========================================================
   STATE
========================================================= */

let device = null;
let server = null;
let service = null;

let write8841 = null;
let notify1e4d = null;

let connected = false;


/* =========================================================
   LOG
========================================================= */

function log(text){

    const el =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    el.textContent +=
        "[" + time + "] " +
        text + "\n";

    el.scrollTop =
        el.scrollHeight;

    console.log(text);
}


function clearLog(){

    document.getElementById("log")
        .textContent = "";

}


/* =========================================================
   HEX
========================================================= */

function hex(data){

    return Array.from(
        data,
        b => b.toString(16)
             .padStart(2,"0")
             .toUpperCase()
    ).join(" ");

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(ok){

    connected = ok;

    const s =
        document.getElementById("status");

    const b =
        document.getElementById("connectBtn");

    if(ok){

        s.textContent =
            "🟢 B3 PRO ĐÃ KẾT NỐI";

        s.style.background =
            "#075d36";

        b.textContent =
            "🔴 NGẮT KẾT NỐI";

        b.className =
            "disconnect";

    }else{

        s.textContent =
            "🔴 Chưa kết nối";

        s.style.background =
            "#292b30";

        b.textContent =
            "🔵 KẾT NỐI B3 PRO";

        b.className =
            "connect";
    }
}


/* =========================================================
   CONNECT
========================================================= */

async function connectBLE(){

    if(connected){

        disconnectBLE();

        return;
    }

    if(!navigator.bluetooth){

        alert(
            "Trình duyệt này không hỗ trợ Web Bluetooth."
        );

        return;
    }

    try{

        log("ĐANG TÌM B3 PRO...");

        device =
            await navigator.bluetooth.requestDevice({

                filters:[
                    {name:"B3PRO"},
                    {namePrefix:"B3"},
                    {namePrefix:"PIVA"}
                ],

                optionalServices:[
                    SERVICE_UUID
                ]
            });


        log(
            "DEVICE = " +
            (device.name || "UNKNOWN")
        );


        device.addEventListener(
            "gattserverdisconnected",
            disconnected
        );


        server =
            await device.gatt.connect();

        log("BLE CONNECTED");


        service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        log(
            "SERVICE = " +
            service.uuid
        );


        await select8841();


        await setupNotify();


        setStatus(true);


        log(
            "=== B3 PRO READY ==="
        );

    }catch(e){

        log(
            "CONNECT ERROR: " +
            (e.message || e)
        );

        setStatus(false);
    }
}


/* =========================================================
   DISCONNECT
========================================================= */

function disconnectBLE(){

    try{

        if(
            device &&
            device.gatt &&
            device.gatt.connected
        ){

            device.gatt.disconnect();

        }

    }catch(e){}

    disconnected();
}


function disconnected(){

    connected = false;

    device = null;
    server = null;
    service = null;

    write8841 = null;
    notify1e4d = null;

    setStatus(false);

    log("BLE DISCONNECTED");
}


/* =========================================================
   FIND WRITE 8841
========================================================= */

async function select8841(){

    if(!service){

        if(!server){

            log(
                "CHƯA CÓ GATT SERVER"
            );

            return false;
        }

        service =
            await server.getPrimaryService(
                SERVICE_UUID
            );
    }


    try{

        write8841 =
            await service.getCharacteristic(
                WRITE_8841_UUID
            );

        log(
            "WRITE 8841 FOUND = " +
            write8841.uuid
        );

        log(
            "WRITE = " +
            write8841.properties.write
        );

        log(
            "WRITE_NO_RESPONSE = " +
            write8841
                .properties
                .writeWithoutResponse
        );

        return true;

    }catch(e){

        log(
            "KHÔNG TÌM THẤY WRITE 8841: " +
            e.message
        );

        return false;
    }
}


/* =========================================================
   NOTIFY 1E4D
========================================================= */

async function setupNotify(){

    try{

        notify1e4d =
            await service.getCharacteristic(
                NOTIFY_1E4D_UUID
            );

        await notify1e4d
            .startNotifications();


        notify1e4d.addEventListener(
            "characteristicvaluechanged",
            onNotify
        );


        log(
            "NOTIFY 1E4D READY"
        );

    }catch(e){

        log(
            "NOTIFY ERROR: " +
            e.message
        );
    }
}


/* =========================================================
   RX
========================================================= */

function onNotify(event){

    const value =
        event.target.value;

    const data =
        new Uint8Array(
            value.buffer,
            value.byteOffset,
            value.byteLength
        );

    log(
        "RX 1E4D: " +
        hex(data)
    );
}


/* =========================================================
   SEND
========================================================= */

let sendQueue =
    Promise.resolve();


function send(bytes){

    return new Promise(resolve => {

        sendQueue =
            sendQueue.then(
                async () => {

                    if(!connected){

                        log(
                            "TX BLOCKED: CHƯA KẾT NỐI"
                        );

                        resolve(false);

                        return;
                    }


                    if(!write8841){

                        const ok =
                            await select8841();

                        if(!ok){

                            resolve(false);

                            return;
                        }
                    }


                    const data =
                        new Uint8Array(bytes);


                    log(
                        "TX -> 8841 | " +
                        hex(data)
                    );


                    try{

                        if(
                            write8841
                                .properties
                                .writeWithoutResponse
                        ){

                            log(
                                "METHOD = WRITE WITHOUT RESPONSE"
                            );

                            await write8841
                                .writeValueWithoutResponse(
                                    data
                                );

                        }else if(
                            write8841
                                .properties
                                .write
                        ){

                            log(
                                "METHOD = WRITE"
                            );

                            await write8841
                                .writeValue(data);

                        }else{

                            throw new Error(
                                "8841 không có WRITE"
                            );
                        }


                        log("TX OK");

                        resolve(true);

                    }catch(e){

                        log(
                            "TX ERROR: " +
                            (e.message || e)
                        );

                        resolve(false);
                    }

                }
            );
    });
}


/* =========================================================
   L1 / L2 / L3
========================================================= */

function setMode(level){

    if(level < 1 || level > 3)
        return;


    document
        .querySelectorAll("#l1,#l2,#l3")
        .forEach(
            x => x.classList.remove("active")
        );


    document
        .getElementById("l" + level)
        .classList.add("active");


    log(
        "=== L" +
        level +
        " ==="
    );


    send([
        0xA5,
        0x02,
        level,
        0x5A
    ]);
}


/* =========================================================
   SMART
========================================================= */

function smart(on){

    log(
        "=== SMART " +
        (on ? "ON" : "OFF") +
        " ==="
    );


    send([
        0xA5,
        0x06,
        on ? 0x01 : 0x00,
        0x5A
    ]);
}


/* =========================================================
   TURBO
========================================================= */

function turbo(on){

    log(
        "=== TURBO " +
        (on ? "ON" : "OFF") +
        " ==="
    );


    send([
        0xA5,
        0x03,
        on ? 0x01 : 0x00,
        0x5A
    ]);
}


/* =========================================================
   FAN
========================================================= */

function fan(percent){

    percent =
        Math.max(
            0,
            Math.min(
                100,
                Number(percent)
            )
        );


    log(
        "=== FAN " +
        percent +
        "% ==="
    );


    send([
        0xA5,
        0x04,
        percent,
        0x5A
    ]);
}


/* =========================================================
   LED MODE
========================================================= */

function led(mode){

    log(
        "=== LED MODE " +
        mode +
        " ==="
    );


    send([
        0xA5,
        0x05,
        mode,
        0x5A
    ]);
}


/* =========================================================
   LED BRIGHTNESS
========================================================= */

function brightnessChanged(value){

    document
        .getElementById(
            "brightnessValue"
        )
        .textContent =
            value + "%";


    /*
       Không gửi liên tục khi kéo slider.
       Chỉ gửi khi người dùng thả ra.
    */

}


/* =========================================================
   LED SPEED
========================================================= */

function speedChanged(value){

    document
        .getElementById(
            "speedValue"
        )
        .textContent =
            value + "%";

}


/* =========================================================
   GATT SCAN
========================================================= */

async function scanGATT(){

    if(!server){

        log(
            "CHƯA KẾT NỐI"
        );

        return;
    }


    try{

        log("");
        log("=== GATT SCAN ===");


        const services =
            await server.getPrimaryServices();


        for(
            const s of services
        ){

            log(
                "SERVICE " +
                s.uuid
            );


            let chars = [];


            try{

                chars =
                    await s.getCharacteristics();

            }catch(e){

                log(
                    "CHAR ERROR " +
                    e.message
                );

                continue;
            }


            for(
                const c of chars
            ){

                let p = [];


                if(c.properties.read)
                    p.push("READ");

                if(c.properties.write)
                    p.push("WRITE");

                if(
                    c.properties
                        .writeWithoutResponse
                )
                    p.push(
                        "WRITE_NO_RESPONSE"
                    );

                if(c.properties.notify)
                    p.push("NOTIFY");

                if(c.properties.indicate)
                    p.push("INDICATE");


                log(
                    "CHAR " +
                    c.uuid +
                    " | " +
                    p.join(", ")
                );


                if(
                    c.uuid.toLowerCase() ===
                    WRITE_8841_UUID.toLowerCase()
                ){

                    write8841 = c;

                    log(
                        ">>> WRITE 8841 FOUND"
                    );
                }


                if(
                    c.uuid.toLowerCase() ===
                    NOTIFY_1E4D_UUID.toLowerCase()
                ){

                    log(
                        ">>> NOTIFY 1E4D FOUND"
                    );
                }
            }
        }


        log(
            "=== SCAN END ==="
        );

    }catch(e){

        log(
            "GATT SCAN ERROR: " +
            e.message
        );
    }
}


/* =========================================================
   START
========================================================= */

setStatus(false);

log(
    "PIVA B3 PRO CONTROLLER READY"
);

log(
    "WRITE 8841 = " +
    WRITE_8841_UUID
);

log(
    "NOTIFY 1E4D = " +
    NOTIFY_1E4D_UUID
);

</script>

</body>
</html>
