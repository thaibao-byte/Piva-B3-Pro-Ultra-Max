<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIVA B3 Pro BLE Controller</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#111;color:#fff;margin:0;padding:18px
}
button{
  border:0;border-radius:12px;padding:13px 16px;
  margin:5px;background:#292929;color:#fff;font-size:15px
}
button:active{transform:scale(.97)}
h1{font-size:22px}
h2{font-size:17px;margin-top:24px}
.status{
  padding:12px;border-radius:10px;background:#222;
  margin-bottom:15px
}
.connected{background:#123b22}
input[type=range]{width:100%}
.log{
  background:#050505;color:#72ff72;
  font-family:monospace;font-size:12px;
  white-space:pre-wrap;word-break:break-word;
  padding:12px;border-radius:10px;
  height:260px;overflow:auto
}
.row{display:flex;flex-wrap:wrap}
.warn{
  background:#3b2c0a;color:#ffd76a;
  padding:12px;border-radius:10px;margin:12px 0
}
</style>
</head>

<body>

<h1>❄️ PIVA B3 Pro Controller</h1>

<div id="status" class="status">Chưa kết nối</div>

<button onclick="connectBLE()">🔵 Kết nối B3 Pro</button>
<button onclick="disconnectBLE()">Ngắt kết nối</button>

<div class="warn">
⚠️ Kênh BLE đã xác định. Payload điều khiển B3 Pro vẫn đang được kiểm chứng.
Các nút bên dưới gửi frame thử nghiệm.
</div>

<h2>Cooling</h2>

<div class="row">
<button onclick="setMode(1)">L1</button>
<button onclick="setMode(2)">L2</button>
<button onclick="setMode(3)">L3</button>
<button onclick="setTurbo(1)">Turbo ON</button>
<button onclick="setTurbo(0)">Turbo OFF</button>
</div>

<h2>Smart</h2>

<div class="row">
<button onclick="setSmart(1)">Smart ON</button>
<button onclick="setSmart(0)">Smart OFF</button>
</div>

<h2>Fan</h2>

<input
 id="fan"
 type="range"
 min="0"
 max="100"
 value="40"
 oninput="document.getElementById('fanValue').textContent=this.value+'%'"
>

<div>Fan: <span id="fanValue">40%</span></div>

<button onclick="setFan()">Gửi Fan</button>

<h2>LED</h2>

<div class="row">
<button onclick="setLED(0)">OFF</button>
<button onclick="setLED(1)">LED 1</button>
<button onclick="setLED(2)">LED 2</button>
<button onclick="setLED(3)">LED 3</button>
<button onclick="setLED(4)">LED 4</button>
<button onclick="setLED(5)">LED 5</button>
<button onclick="setLED(6)">LED 6</button>
<button onclick="setLED(7)">LED 7</button>
<button onclick="setLED(8)">LED 8</button>
<button onclick="setLED(9)">LED 9</button>
</div>

<h2>Brightness</h2>

<input
 id="brightness"
 type="range"
 min="0"
 max="100"
 value="50"
 oninput="document.getElementById('brightnessValue').textContent=this.value"
>

<div>
Brightness:
<span id="brightnessValue">50</span>
</div>

<button onclick="setBrightness()">Gửi Brightness</button>

<h2>LED Speed</h2>

<input
 id="speed"
 type="range"
 min="0"
 max="100"
 value="50"
 oninput="document.getElementById('speedValue').textContent=this.value"
>

<div>
Speed:
<span id="speedValue">50</span>
</div>

<button onclick="setSpeed()">Gửi Speed</button>

<h2>🎨 RGB</h2>

<div class="row">
<button onclick="setColor(255,0,0)">Đỏ</button>
<button onclick="setColor(0,255,0)">Xanh lá</button>
<button onclick="setColor(0,0,255)">Xanh dương</button>
<button onclick="setColor(255,255,255)">Trắng</button>
<button onclick="setColor(255,0,255)">Tím</button>
</div>

<h2>🧪 Test protocol</h2>

<div class="row">
<button onclick="testL1()">TEST L1</button>
<button onclick="testL2()">TEST L2</button>
<button onclick="testL3()">TEST L3</button>
<button onclick="testFan40()">TEST FAN 40</button>
<button onclick="testLED1()">TEST LED 1</button>
<button onclick="testSmart()">TEST SMART</button>
<button onclick="testTurbo()">TEST TURBO</button>
</div>

<h2>Debug</h2>

<div class="row">
<button onclick="scanGatt()">GATT Scan</button>
<button onclick="clearLog()">Clear</button>
</div>

<pre id="log" class="log"></pre>

<script>

const SERVICE_UUID =
"49535343-fe7d-4ae5-8fa9-9fafd205e455";

const RX_UUID =
"49535343-8841-43f4-a8d4-ecbe34729bb3";

const TX_UUID =
"49535343-1e4d-4bd9-ba61-23c647249616";

const CTRL_UUID =
"49535343-6daa-4d02-abf6-19569aca69fe";

let device = null;
let server = null;
let service = null;

let writeChar = null;
let notifyChar = null;


/* =========================
   LOG
========================= */

function log(msg){

  const box = document.getElementById("log");

  const time =
    new Date().toLocaleTimeString();

  box.textContent +=
    `[${time}] ${msg}\n`;

  box.scrollTop = box.scrollHeight;
}


function clearLog(){
  document.getElementById("log").textContent="";
}


function hex(bytes){

  return Array.from(bytes)
    .map(x=>x.toString(16)
    .padStart(2,"0")
    .toUpperCase())
    .join(" ");
}


/* =========================
   CHECKSUM
========================= */

function sum8(bytes){

  return bytes.reduce(
    (sum,b)=>
      (sum + (b & 0xFF)) & 0xFF,
    0
  );
}


/*
 Candidate frame:

 20 A5 CMD PARAM... CHECKSUM

 checksum = sum(all bytes before checksum) & FF
*/

function makeFrame(cmd,...params){

  const body = [
    0x20,
    0xA5,
    cmd & 0xFF,
    ...params.map(x=>x & 0xFF)
  ];

  const checksum = sum8(body);

  return new Uint8Array([
    ...body,
    checksum
  ]);
}


/* =========================
   CONNECT
========================= */

async function connectBLE(){

  try{

    if(!navigator.bluetooth){

      alert(
        "Trình duyệt không hỗ trợ Web Bluetooth."
      );

      return;
    }

    log("Đang tìm PIVA B3 Pro...");

    device =
      await navigator.bluetooth.requestDevice({

        filters:[
          {
            services:[SERVICE_UUID]
          },
          {
            namePrefix:"PIVA"
          },
          {
            namePrefix:"B3"
          }
        ],

        optionalServices:[
          SERVICE_UUID
        ]

      });

    log(
      "Device: " +
      (device.name || "Unknown")
    );

    device.addEventListener(
      "gattserverdisconnected",
      onDisconnected
    );

    server =
      await device.gatt.connect();

    log("GATT connected");

    service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    log("Service OK");


    /*
     Find RX
    */

    try{

      writeChar =
        await service.getCharacteristic(
          RX_UUID
        );

      log(
        "RX 8841 = WRITE OK"
      );

    }catch(e){

      log(
        "Không lấy được RX 8841: " +
        e
      );

    }


    /*
     Find TX
    */

    try{

      notifyChar =
        await service.getCharacteristic(
          TX_UUID
        );

      await notifyChar.startNotifications();

      notifyChar.addEventListener(
        "characteristicvaluechanged",
        handleNotify
      );

      log(
        "TX 1E4D = NOTIFY OK"
      );

    }catch(e){

      log(
        "Không lấy được TX 1E4D: " +
        e
      );

    }


    updateStatus(true);

    await scanGatt();

  }catch(e){

    log(
      "CONNECT ERROR: " +
      e.message
    );

  }

}


/* =========================
   DISCONNECT
========================= */

function disconnectBLE(){

  if(device?.gatt?.connected){

    device.gatt.disconnect();

  }

  updateStatus(false);

}


function onDisconnected(){

  log("BLE disconnected");

  updateStatus(false);

}


function updateStatus(ok){

  const el =
    document.getElementById("status");

  if(ok){

    el.textContent =
      "🟢 Đã kết nối";

    el.className =
      "status connected";

  }else{

    el.textContent =
      "🔴 Chưa kết nối";

    el.className =
      "status";

  }

}


/* =========================
   NOTIFY
========================= */

function handleNotify(event){

  const data =
    new Uint8Array(
      event.target.value.buffer
    );

  log(
    "RX ← " +
    hex(data)
  );

}


/* =========================
   WRITE
========================= */

async function send(bytes){

  if(!writeChar){

    log(
      "❌ Chưa có RX 8841"
    );

    return false;
  }

  try{

    log(
      "TX → " +
      hex(bytes)
    );

    await writeChar.writeValueWithoutResponse(
      bytes
    );

    log("TX OK");

    return true;

  }catch(e){

    log(
      "TX ERROR: " +
      e.message
    );

    return false;
  }

}


/* =========================
   SEND PIVA CANDIDATE
========================= */

async function pivaCommand(
  name,
  cmd,
  ...params
){

  const frame =
    makeFrame(
      cmd,
      ...params
    );

  log(
    `CMD ${name}: ${hex(frame)}`
  );

  return await send(frame);

}


/* =========================
   COOLING
========================= */

function setMode(level){

  if(level < 1 || level > 3)
    return;

  pivaCommand(
    "MODE L"+level,
    0x02,
    level
  );

}


function setTurbo(value){

  pivaCommand(
    value ? "TURBO ON" : "TURBO OFF",
    0x03,
    value
  );

}


function setSmart(value){

  pivaCommand(
    value ? "SMART ON" : "SMART OFF",
    0x06,
    value
  );

}


/* =========================
   FAN
========================= */

function setFan(){

  const value =
    Number(
      document.getElementById("fan").value
    );

  pivaCommand(
    "FAN",
    0x04,
    value
  );

}


/* =========================
   LED
========================= */

function setLED(mode){

  pivaCommand(
    "LED "+mode,
    0x05,
    mode
  );

}


function setColor(r,g,b){

  pivaCommand(
    "RGB",
    0x07,
    r,
    g,
    b
  );

}


function setBrightness(){

  const value =
    Number(
      document.getElementById(
        "brightness"
      ).value
    );

  pivaCommand(
    "BRIGHTNESS",
    0x08,
    value
  );

}


function setSpeed(){

  const value =
    Number(
      document.getElementById(
        "speed"
      ).value
    );

  pivaCommand(
    "LED SPEED",
    0x09,
    value
  );

}


/* =========================
   EXACT TESTS
========================= */

function testL1(){

  // 20 A5 02 01 C8

  pivaCommand(
    "TEST L1",
    0x02,
    0x01
  );

}


function testL2(){

  // 20 A5 02 02 C9

  pivaCommand(
    "TEST L2",
    0x02,
    0x02
  );

}


function testL3(){

  // 20 A5 02 03 CA

  pivaCommand(
    "TEST L3",
    0x02,
    0x03
  );

}


function testFan40(){

  // 20 A5 04 28 F1

  pivaCommand(
    "TEST FAN 40",
    0x04,
    0x28
  );

}


function testLED1(){

  // 20 A5 05 01 CB

  pivaCommand(
    "TEST LED 1",
    0x05,
    0x01
  );

}


function testSmart(){

  // 20 A5 06 01 CC

  pivaCommand(
    "TEST SMART",
    0x06,
    0x01
  );

}


function testTurbo(){

  // 20 A5 03 01 C9

  pivaCommand(
    "TEST TURBO",
    0x03,
    0x01
  );

}


/* =========================
   GATT SCAN
========================= */

async function scanGatt(){

  if(!service){

    log("Chưa có service");

    return;
  }

  try{

    const chars =
      await service.getCharacteristics();

    log(
      `GATT: ${chars.length} characteristics`
    );

    for(const c of chars){

      log(
        `${c.uuid} | ` +
        `${Array.from(c.properties).join(",")}`
      );

    }

  }catch(e){

    log(
      "GATT ERROR: " +
      e.message
    );

  }

}

</script>

</body>
</html>
