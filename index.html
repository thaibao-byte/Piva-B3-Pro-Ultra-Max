<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piva B3 Pro Controller</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --danger: #ef4444; --text: #f8fafc; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h2 { margin: 0 0 12px 0; font-size: 1.1rem; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
    .btn-danger { background: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
    .dash-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; }
    .dash-val { font-size: 1.4rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    .dash-lbl { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    button.opt-btn { background: #334155; color: white; border: 1px solid #475569; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; transition: all 0.2s; }
    button.opt-btn.active { background: #10b981; border-color: #34d399; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    button.opt-btn.btn-off { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
    .sub-title { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    .status { font-size: 0.85rem; color: #a7f3d0; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="grid-2" style="margin-bottom: 0;">
      <button id="connectBtn" class="btn">Kết Nối Sò B3 Pro</button>
      <button id="disconnectBtn" class="btn btn-danger" onclick="disconnectDevice()" disabled>Ngắt Kết Nối</button>
    </div>
    <div id="statusText" class="status">Trạng thái: Chưa kết nối</div>
  </div>

  <div class="card">
    <h2>Thông Số Hoạt Động (Firmware V212)</h2>
    <div class="dashboard">
      <div class="dash-item">
        <div class="dash-lbl">Tốc độ quạt</div>
        <div id="valFan" class="dash-val">0 RPM</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Công suất</div>
        <div id="valPower" class="dash-val">0 W</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Nhiệt độ mặt lạnh</div>
        <div id="valTemp" class="dash-val">0 °C</div>
      </div>
      <div class="dash-item">
        <div class="dash-lbl">Nguồn điện</div>
        <div id="valProtocol" class="dash-val">OFF</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Chế Độ Hoạt Động</h2>
    
    <div class="sub-title">Chế độ hiệu năng:</div>
    <div class="grid-3" style="margin-bottom: 14px;">
      <button id="btnL1" class="opt-btn" onclick="sendControlCmd(1)">Mức L1</button>
      <button id="btnL2" class="opt-btn" onclick="sendControlCmd(2)">Mức L2</button>
      <button id="btnL3" class="opt-btn" onclick="sendControlCmd(3)">Mức L3</button>
    </div>

    <div class="sub-title">Nâng cao & Đèn LED:</div>
    <div class="grid-2" style="margin-bottom: 14px;">
      <button id="btnOc" class="opt-btn" onclick="sendControlCmd(6)">Ép xung (27W)</button>
      <button id="btnSmart" class="opt-btn" onclick="sendControlCmd(4)">Thông minh</button>
    </div>
    <div class="grid-2" style="margin-bottom: 14px;">
      <button class="opt-btn" onclick="sendLedCmd(1)">Bật LED RGB</button>
      <button class="opt-btn" onclick="sendLedCmd(0)">Tắt LED RGB</button>
    </div>

    <div class="sub-title">Điều khiển nguồn:</div>
    <div>
      <button class="opt-btn btn-off" style="width: 100%;" onclick="sendControlCmd(0)">Tắt Sò (Standby)</button>
    </div>
  </div>
</div>

<script>
  const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
  const WRITE_UUID_1 = '49535343-6daa-4d02-abf6-19569aca69fe';
  const WRITE_UUID_2 = '49535343-8841-43f4-a8d4-ecbe34729bb3';
  const NOTIFY_UUID  = '49535343-1e4d-4bd9-ba61-23c647249616';

  let bluetoothDevice = null;
  let charWrite1 = null, charWrite2 = null, charNotify = null;

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      document.getElementById('statusText').innerText = "Trạng thái: Đang kết nối...";
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

      const server = await bluetoothDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);

      try { charWrite1 = await service.getCharacteristic(WRITE_UUID_1); } catch(e){}
      try { charWrite2 = await service.getCharacteristic(WRITE_UUID_2); } catch(e){}
      
      charNotify = await service.getCharacteristic(NOTIFY_UUID);
      await charNotify.startNotifications();
      charNotify.addEventListener('characteristicvaluechanged', handleNotifications);

      document.getElementById('statusText').innerText = "Trạng thái: Đã kết nối thành công!";
      document.getElementById('connectBtn').innerText = "Đã Kết Nối";
      document.getElementById('connectBtn').disabled = true;
      document.getElementById('disconnectBtn').disabled = false;

    } catch (error) {
      document.getElementById('statusText').innerText = "Lỗi kết nối: " + error.message;
    }
  });

  function disconnectDevice() {
    if (bluetoothDevice && bluetoothDevice.gatt.connected) {
      bluetoothDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    document.getElementById('statusText').innerText = "Trạng thái: Đã ngắt kết nối!";
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('connectBtn').innerText = "Kết Nối Sò B3 Pro";
    document.getElementById('disconnectBtn').disabled = true;
    document.getElementById('valPower').innerText = "0 W";
    document.getElementById('valFan').innerText = "0 RPM";
    document.getElementById('valTemp').innerText = "0 °C";
    document.getElementById('valProtocol').innerText = "OFF";
    highlightButton(-1);
  }

  function highlightButton(mode) {
    ['btnL1', 'btnL2', 'btnL3', 'btnOc', 'btnSmart'].forEach(id => {
      document.getElementById(id)?.classList.remove('active');
    });
    if (mode === 1) document.getElementById('btnL1')?.classList.add('active');
    if (mode === 2) document.getElementById('btnL2')?.classList.add('active');
    if (mode === 3) document.getElementById('btnL3')?.classList.add('active');
    if (mode === 4) document.getElementById('btnSmart')?.classList.add('active');
    if (mode === 6) document.getElementById('btnOc')?.classList.add('active');
  }

  async function writePacket(packet) {
    const targets = [charWrite1, charWrite2, charNotify];
    for (const char of targets) {
      if (!char) continue;
      try {
        if (char.properties.writeWithoutResponse) {
          await char.writeValueWithoutResponse(packet);
        } else {
          await char.writeValue(packet);
        }
      } catch (e) {
        try { await char.writeValue(packet); } catch(err){}
      }
    }
  }

  async function sendControlCmd(mode) {
    highlightButton(mode);
    
    // Mode 0 = Tắt Sò (Standby)
    const header = [0x20, 0xA5, 0x03, 0x01, mode, 0x00];
    const checksum = header.reduce((a, b) => a + b, 0) & 0xFF;
    const packet = new Uint8Array([...header, checksum]);

    await writePacket(packet);
  }

  async function sendLedCmd(state) {
    const header = [0x20, 0xA5, 0x03, 0x02, state, 0x00];
    const checksum = header.reduce((a, b) => a + b, 0) & 0xFF;
    const packet = new Uint8Array([...header, checksum]);

    await writePacket(packet);
  }

  function handleNotifications(event) {
    const data = event.target.value;
    if (data.byteLength < 8) return;

    if (data.getUint8(0) === 0x20 && data.getUint8(1) === 0xA5) {
      const power = data.getUint8(3);
      document.getElementById('valPower').innerText = power + " W";

      const currentMode = data.getUint8(4);
      highlightButton(currentMode);

      const rawTemp = data.getUint8(5);
      const realTemp = power > 0 ? Math.max(0, rawTemp - 25) : 0;
      document.getElementById('valTemp').innerText = realTemp + " °C";

      const rpmHigh = data.getUint8(7);
      const rpmLow = data.getUint8(6);
      const rpm = (rpmHigh << 8) | rpmLow;

      document.getElementById('valFan').innerText = rpm + " RPM";
      document.getElementById('valProtocol').innerText = power >= 20 ? "PPS" : (power > 0 ? "PD / Normal" : "OFF");
    }
  }
</script>
</body>
</html>
